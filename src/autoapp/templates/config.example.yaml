llm:
  # Which AI model writes your documents. Choose one provider:
  #   anthropic   Claude. Best quality, web search for company research. Costs a little per package.
  #   ollama      Llama on your own computer. Free and private. Needs a fairly modern computer.
  #   groq        Llama on Groq's servers. Free tier with limits, no card needed.
  #   openrouter  Many models, some free. gemini: Google's free tier. xai: Grok (paid, no standing free tier).
  provider: anthropic
  model: ""            # empty = a sensible default for the provider. Set it to use a different model.
  effort: medium       # Claude only: low, medium, high
  web_search: true     # Claude only: lets the model search the web for company research
  num_ctx: 16384       # Ollama only: how much text the model can read at once
sources:
  adzuna:
    enabled: true      # free key: https://developer.adzuna.com  (ADZUNA_APP_ID, ADZUNA_APP_KEY)
  jooble:
    enabled: false     # free key on request (JOOBLE_API_KEY)
  arbeitnow:
    enabled: true      # no key needed
output_dir: applications
db_path: data/autoapp.db
max_applications_per_run: 5
